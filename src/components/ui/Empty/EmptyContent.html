<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "", children } = props();

  const base = "flex w-full max-w-sm min-w-0 flex-col items-center gap-2.5 text-sm text-balance";

  const classes = () => twMerge(base, className);
</script>

<div data-slot="empty-content" class="{classes()}">{children}</div>
