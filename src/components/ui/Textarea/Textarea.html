<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const {
    class: className = "",
    disabled = false,
    required = false,
    readonly = false,
    invalid = false,
    placeholder,
    value,
    name,
    id,
    rows,
    oninput,
    onchange,
    onfocus,
    onblur,
  } = props();

  const base =
    "flex field-sizing-content min-h-16 w-full rounded-lg border border-border bg-background px-2.5 py-2 text-sm text-foreground transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20";

  const classes = () => twMerge(base, className);

  const handleInput = (e) => oninput && oninput(e);
  const handleChange = (e) => onchange && onchange(e);
  const handleFocus = (e) => onfocus && onfocus(e);
  const handleBlur = (e) => onblur && onblur(e);
</script>

<textarea
  class="{classes()}"
  placeholder="{placeholder}"
  name="{name}"
  id="{id}"
  rows="{rows}"
  disabled="{disabled}"
  required="{required}"
  readonly="{readonly}"
  aria-invalid="{invalid}"
  oninput="handleInput()"
  onchange="handleChange()"
  onfocus="handleFocus()"
  onblur="handleBlur()"
>{value}</textarea>
