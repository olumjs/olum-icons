<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { align = "inline-start", class: className = "", children } = props();

  const base =
    "flex h-auto cursor-text items-center justify-center gap-2 py-1.5 text-sm font-medium text-muted-foreground select-none group-data-[disabled=true]/input-group:opacity-50 [&>kbd]:rounded-[calc(var(--radius)-5px)] [&>svg:not([class*='size-'])]:size-4";

  const aligns = {
    "inline-start": "order-first pl-2 has-[>button]:ml-[-0.3rem] has-[>kbd]:ml-[-0.15rem]",
    "inline-end": "order-last pr-2 has-[>button]:mr-[-0.3rem] has-[>kbd]:mr-[-0.15rem]",
    "block-start": "order-first w-full justify-start px-2.5 pt-2",
    "block-end": "order-last w-full justify-start px-2.5 pb-2",
  };

  const classes = () => twMerge(base, aligns[align] || aligns["inline-start"], className);
</script>

<div role="group" data-slot="input-group-addon" data-align="{align}" class="{classes()}">{children}</div>
