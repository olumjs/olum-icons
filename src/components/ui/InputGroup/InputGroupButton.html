<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";
  import Button from "../Button/Button";

  const { type = "button", variant = "ghost", size = "xs", value, ariaLabel, class: className = "", children } = props();

  const sizes = {
    xs: "h-6 gap-1 rounded-[calc(var(--radius)-3px)] px-1.5 [&>svg:not([class*='size-'])]:size-3.5",
    sm: "",
    "icon-xs": "size-6 rounded-[calc(var(--radius)-3px)] p-0",
    "icon-sm": "size-8 p-0",
  };

  const classes = () => twMerge("flex items-center gap-2 text-sm shadow-none", sizes[size] || sizes.xs, className);
</script>

<Button type="{type}" variant="{variant}" value="{value}" ariaLabel="{ariaLabel}" class="{classes()}">{children}</Button>
