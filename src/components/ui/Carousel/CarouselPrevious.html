<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";
  import { carouselStore, applyOffset } from "./carouselStore";
  import { animateValue } from "./animate";

  const { class: className = "" } = props();

  const state = { id: null };

  const parts = () => {
    const root = host.closest('[data-slot="carousel"]');
    return {
      viewport: root && root.querySelector('[data-slot="carousel-content"]'),
      track: root && root.querySelector('[data-slot="carousel-track"]'),
    };
  };

  onMount(() => {
    const root = host.closest('[data-slot="carousel"]');
    if (!root) return;
    state.id = root.dataset.carouselId;
  });

  // Reading carouselStore.getOffset(state.id) here subscribes this component
  // to the store, so `disabled` stays correct whether the offset last changed
  // from a drag in CarouselContent or a click on CarouselNext -- no
  // MutationObserver/custom event needed, just the store's normal reactivity.
  const isDisabled = () => state.id == null || carouselStore.getOffset(state.id) <= 0;

  const go = () => {
    const { track, viewport } = parts();
    if (!track || !viewport || state.id == null) return;
    const current = carouselStore.getOffset(state.id);
    const target = Math.max(0, current - (viewport.clientWidth + 16));
    animateValue(current, target, 600, (v) => {
      applyOffset(state.id, v);
    });
  };

  const classes = () =>
    twMerge(
      "absolute inset-y-0 -left-12 z-10 my-auto inline-flex size-7 touch-manipulation items-center justify-center rounded-full border border-border bg-background transition-all hover:bg-muted disabled:pointer-events-none disabled:opacity-50 [&_svg]:size-3.5",
      className,
    );
</script>

<button type="button" data-slot="carousel-previous" class="{classes()}" disabled="{isDisabled()}" onclick="go()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
  <span class="sr-only">Previous slide</span>
</button>
