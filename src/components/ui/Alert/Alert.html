<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { variant = "default", class: className = "", children } = props();

  const base =
    "group/alert relative grid w-full gap-0.5 rounded-lg border border-border px-2.5 py-2 text-left text-sm has-[[data-slot=alert-action]]:pr-18 has-[>[data-icon]]:grid-cols-[auto_1fr] has-[>[data-icon]]:gap-x-2 [&>[data-icon]]:row-span-2 [&>[data-icon]]:translate-y-0.5 [&>[data-icon]]:text-current [&>[data-icon]_svg:not([class*='size-'])]:size-4 [&>*:has([data-slot=alert-action])]:absolute [&>*:has([data-slot=alert-action])]:top-2 [&>*:has([data-slot=alert-action])]:right-2";

  const variants = {
    default: "bg-background text-foreground",
    destructive: "bg-background text-destructive [&_[data-slot=alert-description]]:text-destructive/90",
  };

  const classes = () => twMerge(base, variants[variant] || variants.default, className);
</script>

<div data-slot="alert" role="alert" class="{classes()}">{children}</div>
