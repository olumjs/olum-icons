<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";

  const { inset = false, class: className = "", children } = props();

  onMount(() => {
    const root = host.closest('[data-slot="dropdown-menu-sub"]');
    const input = root && root.querySelector(":scope > input");
    const el = host.querySelector("button");

    const set = (val) => {
      if (!input) return;
      input.checked = val;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const onEnter = () => set(true);
    const onLeave = () => set(false);

    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);
    return () => {
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
    };
  });

  const base =
    "flex w-full cursor-default items-center gap-1.5 rounded-md px-1.5 py-1 text-sm outline-none select-none hover:bg-muted [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const classes = () => twMerge(base, inset ? "pl-7" : "", className);
</script>

<button type="button" data-slot="dropdown-menu-sub-trigger" data-inset="{inset}" class="{classes()}">
  {children}
  <svg class="ml-auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
</button>
