<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { value, defaultChecked = false, inset = false, disabled = false, onCheckedChange, class: className = "", children } = props();

  const state = { checked: defaultChecked };

  const toggle = () => {
    state.checked = !state.checked;
    onCheckedChange && onCheckedChange(state.checked);
  };

  const base =
    "relative flex w-full cursor-default items-center gap-1.5 rounded-md py-1 pr-8 pl-1.5 text-sm outline-none select-none hover:bg-muted disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const classes = () => twMerge(base, inset ? "pl-7" : "", className);
</script>

<button
  type="button"
  data-slot="dropdown-menu-checkbox-item"
  data-inset="{inset}"
  data-value="{value}"
  role="menuitemcheckbox"
  aria-checked="{state.checked}"
  disabled="{disabled}"
  class="{classes()}"
  onclick="toggle()"
>
  <show when="state.checked">
    <span class="pointer-events-none absolute right-2 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
    </span>
  </show>
  {children}
</button>
