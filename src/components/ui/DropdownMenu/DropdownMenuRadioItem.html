<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { name = "dropdown-radio", value, defaultChecked = false, inset = false, disabled = false, onCheckedChange, class: className = "", children } = props();

  const handleChange = () => onCheckedChange && onCheckedChange(value);

  const base =
    "relative flex w-full cursor-default items-center gap-1.5 rounded-md py-1 pr-8 pl-1.5 text-sm outline-none select-none hover:bg-muted has-checked:bg-muted disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const classes = () => twMerge(base, inset ? "pl-7" : "", className);
</script>

<label data-slot="dropdown-menu-radio-item" data-inset="{inset}" class="{classes()}">
  <input type="radio" name="{name}" value="{value}" class="peer sr-only" checked="{defaultChecked}" disabled="{disabled}" onchange="handleChange()" />
  <span class="pointer-events-none absolute right-2 hidden items-center justify-center peer-checked:flex">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
  </span>
  {children}
</label>
