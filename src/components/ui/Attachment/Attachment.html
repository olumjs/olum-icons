<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { state: dataState = "done", size = "default", orientation = "horizontal", class: className = "", children } = props();

  const base =
    "group/attachment relative flex w-fit max-w-full min-w-0 shrink-0 flex-wrap rounded-xl border border-border bg-background text-foreground transition-colors focus-within:ring-1 focus-within:ring-ring/50 data-[state=error]:border-destructive/30 data-[state=idle]:border-dashed [&>[data-olum]]:contents";

  const sizes = {
    default: "gap-2 text-sm has-[[data-slot=attachment-content]]:px-2.5 has-[[data-slot=attachment-content]]:py-2 has-[[data-slot=attachment-media]]:p-2",
    sm: "gap-2.5 text-xs has-[[data-slot=attachment-content]]:px-2 has-[[data-slot=attachment-content]]:py-1.5 has-[[data-slot=attachment-media]]:p-1.5",
    xs: "gap-1.5 rounded-lg text-xs has-[[data-slot=attachment-content]]:px-1.5 has-[[data-slot=attachment-content]]:py-1 has-[[data-slot=attachment-media]]:p-1",
  };

  const orientations = {
    horizontal: "min-w-40 items-center",
    vertical: "w-24 flex-col has-[[data-slot=attachment-content]]:w-30",
  };

  const classes = () => twMerge(base, sizes[size] || sizes.default, orientations[orientation] || orientations.horizontal, className);
</script>

<div data-slot="attachment" data-state="{dataState}" data-size="{size}" data-orientation="{orientation}" class="{classes()}">{children}</div>
