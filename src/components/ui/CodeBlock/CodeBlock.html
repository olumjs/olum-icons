<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  // `html` is Shiki output from scripts/gen-snippets.mjs; `code` is the raw
  // text the copy button puts on the clipboard. Plain-text callers pass only
  // `code` and get the unhighlighted branch.
  const { code = "", html = "", label = "", class: className = "" } = props();

  const state = { copied: false };
  let timer;

  const icons = {
    copy: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg>`,
    check: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>`,
  };

  // The plain branch renders markup snippets (JSX tags, Vue templates), so they
  // must land in the DOM as text, not as elements -- escape first, then hand the
  // result to `html`, which writes innerHTML verbatim.
  const escaped = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const copy = async () => {
    await navigator.clipboard.writeText(code);
    state.copied = true;
    clearTimeout(timer);
    timer = setTimeout(() => (state.copied = false), 1200);
  };

  const wrapperClass = () => twMerge("overflow-hidden rounded-xl border border-border bg-muted/40", className);
</script>

<div data-slot="code-block" class="{wrapperClass()}">
  <div class="flex items-center justify-between gap-3 border-b border-border px-3 py-1.5">
    <span class="font-mono text-xs text-muted-foreground">{label}</span>
    <button
      type="button"
      onclick="copy()"
      aria-label="Copy code"
      class="inline-flex items-center gap-1.5 rounded-md px-2 py-1 text-xs text-muted-foreground transition-colors hover:bg-muted hover:text-foreground [&_svg]:size-3.5"
    >
      <div html="state.copied ? icons.check : icons.copy"></div>
      {state.copied ? "Copied" : "Copy"}
    </button>
  </div>

  <!-- Shiki wraps its own <pre>; the plain branch supplies one. Both scroll
       horizontally rather than letting a long line widen the page. -->
  <if when="html">
    <div class="overflow-x-auto text-sm [&_pre]:bg-transparent! [&_pre]:p-4" html="html"></div>
  </if>
  <else>
    <pre class="overflow-x-auto p-4 font-mono text-sm leading-relaxed text-foreground"><code html="escaped"></code></pre>
  </else>
</div>
