<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { name = "radio-group", value, defaultChecked = false, disabled = false, id, class: className = "", onCheckedChange } = props();

  const handleChange = (e) => {
    onCheckedChange && onCheckedChange(value);
  };

  const base =
    "peer relative flex aspect-square size-4 shrink-0 appearance-none cursor-pointer rounded-full border border-border bg-background outline-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 checked:border-primary checked:bg-primary";

  const classes = () => twMerge(base, className);
</script>

<span class="relative inline-flex size-4 shrink-0">
  <input
    data-slot="radio-group-item"
    type="radio"
    name="{name}"
    value="{value}"
    id="{id}"
    class="{classes()}"
    checked="{defaultChecked}"
    disabled="{disabled}"
    onchange="handleChange()"
  />
  <span class="pointer-events-none absolute top-1/2 left-1/2 hidden size-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary-foreground peer-checked:block"></span>
</span>
