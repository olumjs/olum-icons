<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { variant = "default", size = "default", href = "#", to, target, rel, ariaLabel, class: className = "", disabled = false, children } = props();

  const base =
    "group/button inline-flex shrink-0 items-center justify-center rounded-lg border bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:translate-y-px aria-disabled:pointer-events-none aria-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const variants = {
    default: "border-transparent bg-primary text-primary-foreground hover:bg-primary/80",
    destructive:
      "border-transparent bg-destructive/10 text-destructive hover:bg-destructive/20 focus-visible:border-destructive/40 focus-visible:ring-destructive/20",
    outline: "border-border bg-background hover:bg-muted hover:text-foreground",
    secondary:
      "border-transparent bg-secondary text-secondary-foreground hover:bg-[color-mix(in_oklch,var(--olum-secondary),var(--olum-foreground)_5%)]",
    ghost: "border-transparent hover:bg-muted hover:text-foreground",
    link: "border-transparent text-primary underline-offset-4 hover:underline",
  };

  const sizes = {
    default: "h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2",
    xs: "h-6 gap-1 rounded-[min(var(--radius-md),10px)] px-2 text-xs has-data-[icon=inline-end]:pr-1.5 has-data-[icon=inline-start]:pl-1.5 [&_svg:not([class*='size-'])]:size-3",
    sm: "h-7 gap-1 rounded-[min(var(--radius-md),12px)] px-2.5 text-[0.8rem] has-data-[icon=inline-end]:pr-1.5 has-data-[icon=inline-start]:pl-1.5 [&_svg:not([class*='size-'])]:size-3.5",
    lg: "h-9 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2",
    icon: "size-8",
    "icon-xs": "size-6 rounded-[min(var(--radius-md),10px)]",
    "icon-sm": "size-7 rounded-[min(var(--radius-md),12px)]",
    "icon-lg": "size-9",
  };

  // A router `to` anchor navigates off e.target, so a nested icon would swallow
  // clicks that land on it -- neutralise children's pointer events on that path.
  const classes = () => twMerge(base, variants[variant] || variants.default, sizes[size] || sizes.default, to ? "[&>*]:pointer-events-none" : "", className);

  // target="_blank" without rel leaks the referrer and the opener.
  const relValue = () => rel || (target === "_blank" ? "noreferrer" : null);
</script>

<if when="to">
  <a data-slot="anchor" to="{to}" aria-label="{ariaLabel}" class="{classes()}" aria-disabled="{disabled}">{children}</a>
</if>
<else>
  <a data-slot="anchor" href="{href}" aria-label="{ariaLabel}" target="{target}" rel="{relValue()}" class="{classes()}" aria-disabled="{disabled}">{children}</a>
</else>
