<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { value, group = "tabs", variant = "default", defaultChecked = false, disabled = false, class: className = "", children } = props();

  const base =
    "relative inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 rounded-md border border-transparent px-1.5 py-0.5 text-sm font-medium whitespace-nowrap text-foreground/60 transition-all cursor-pointer hover:text-foreground has-focus-visible:border-ring has-focus-visible:ring-3 has-focus-visible:ring-ring/50 has-disabled:pointer-events-none has-disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const variants = {
    default: "has-[:checked]:bg-background has-[:checked]:text-foreground has-[:checked]:shadow-sm",
    line: "has-[:checked]:text-foreground after:absolute after:inset-x-0 after:bottom-[-5px] after:h-0.5 after:bg-foreground after:opacity-0 has-[:checked]:after:opacity-100",
  };

  const classes = () => twMerge(base, variants[variant] || variants.default, className);
</script>

<label data-slot="tabs-trigger" role="tab" class="{classes()}">
  <input type="radio" name="{group}" value="{value}" class="peer sr-only" checked="{defaultChecked}" disabled="{disabled}" />
  {children}
</label>
