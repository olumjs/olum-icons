<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { size = "default", class: className = "", children } = props();

  // [&>[data-olum]]:contents: AvatarFallback/AvatarImage are each their own
  // component, so Avatar's real direct child is their bare host wrapper div,
  // not their data-slot element. That wrapper has no explicit height, so the
  // fallback's size-full (height:100%) falls back to auto instead of filling
  // the circle. Collapsing the wrapper makes the data-slot element the actual
  // direct child, letting size-full resolve against Avatar's real dimensions.
  const base =
    "group/avatar relative flex size-8 shrink-0 rounded-full select-none [&>[data-olum]]:contents after:absolute after:inset-0 after:rounded-full after:border after:border-border after:mix-blend-darken";

  const sizes = {
    default: "",
    sm: "size-6",
    lg: "size-10",
  };

  const classes = () => twMerge(base, sizes[size] || sizes.default, className);
</script>

<div data-slot="avatar" data-size="{size}" class="{classes()}">{children}</div>
