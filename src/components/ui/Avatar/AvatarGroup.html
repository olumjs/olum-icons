<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "", children } = props();

  const base =
    "group/avatar-group flex -space-x-2 [&_[data-slot=avatar]]:ring-2 [&_[data-slot=avatar]]:ring-background";

  const classes = () => twMerge(base, className);
</script>

<div data-slot="avatar-group" class="{classes()}">{children}</div>
