<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { variant = "default", align = "start", class: className = "", children } = props();

  const base =
    "group/bubble relative flex w-fit max-w-[80%] min-w-0 flex-col gap-1 group-data-[align=end]/message:self-end data-[align=end]:self-end data-[variant=ghost]:max-w-full";

  const variants = {
    default:
      "[&_[data-slot=bubble-content]]:bg-primary [&_[data-slot=bubble-content]]:text-primary-foreground [&_[data-slot=bubble-content]:is(button,a):hover]:bg-primary/80",
    secondary:
      "[&_[data-slot=bubble-content]]:bg-secondary [&_[data-slot=bubble-content]]:text-secondary-foreground [&_[data-slot=bubble-content]:is(button,a):hover]:bg-[color-mix(in_oklch,var(--olum-secondary),var(--olum-foreground)_5%)]",
    muted:
      "[&_[data-slot=bubble-content]]:bg-muted [&_[data-slot=bubble-content]:is(button,a):hover]:bg-[color-mix(in_oklch,var(--olum-muted),var(--olum-foreground)_5%)]",
    // The tint pins its own lightness, so it needs a dark counterpart: at 0.93
    // it sits under a near-white foreground in dark mode and vanishes. 0.3
    // clears both the background (0.145) and muted (0.269) so it stays a
    // distinct surface, and the extra chroma keeps the hue readable on a
    // themed primary.
    tinted:
      "[&_[data-slot=bubble-content]]:bg-[oklch(from_var(--olum-primary)_0.93_calc(c*0.4)_h)] [&_[data-slot=bubble-content]]:text-foreground [&_[data-slot=bubble-content]:is(button,a):hover]:bg-[oklch(from_var(--olum-primary)_0.88_calc(c*0.5)_h)] dark:[&_[data-slot=bubble-content]]:bg-[oklch(from_var(--olum-primary)_0.3_calc(c*0.6)_h)] dark:[&_[data-slot=bubble-content]:is(button,a):hover]:bg-[oklch(from_var(--olum-primary)_0.36_calc(c*0.7)_h)]",
    outline:
      "[&_[data-slot=bubble-content]]:border-border [&_[data-slot=bubble-content]]:bg-background [&_[data-slot=bubble-content]:is(button,a):hover]:bg-muted [&_[data-slot=bubble-content]:is(button,a):hover]:text-foreground",
    ghost:
      "border-none [&_[data-slot=bubble-content]]:rounded-none [&_[data-slot=bubble-content]]:bg-transparent [&_[data-slot=bubble-content]]:p-0 [&_[data-slot=bubble-content]:is(button,a):hover]:bg-muted [&_[data-slot=bubble-content]:is(button,a):hover]:text-foreground",
    destructive:
      "[&_[data-slot=bubble-content]]:bg-destructive/10 [&_[data-slot=bubble-content]]:text-destructive [&_[data-slot=bubble-content]:is(button,a):hover]:bg-destructive/20",
  };

  const classes = () => twMerge(base, variants[variant] || variants.default, className);
</script>

<div data-slot="bubble" data-variant="{variant}" data-align="{align}" class="{classes()}">{children}</div>
