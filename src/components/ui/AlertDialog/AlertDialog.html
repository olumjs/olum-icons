<script>
  import { props } from "olum";

  const { defaultOpen = false, children } = props();
</script>

<!--
  The checkbox stays the source of truth for open/closed, but visibility is
  no longer driven from here by has-[>input:checked] descendant selectors:
  AlertDialogContent moves the overlay/panel into <body> (see portal.js)
  so the page can be blurred with a real filter, and once portaled they are no
  longer descendants of this element for CSS to reach. AlertDialogContent
  syncs them imperatively off this checkbox's change event instead.
-->
<div data-slot="alert-dialog" class="contents">
  <input type="checkbox" class="hidden" checked="{defaultOpen}" />
  {children}
</div>
