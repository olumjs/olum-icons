<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";
  import Calendar from "../Calendar/Calendar";

  const { placeholder = "Pick a date", class: className = "" } = props();

  const state = { open: false, ts: null };

  const label = () =>
    state.ts ? new Date(state.ts).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) : placeholder;

  const pick = (d) => {
    state.ts = d.getTime();
    state.open = false;
  };

  onMount(() => {
    const onDocClick = (e) => {
      if (!host.contains(e.target)) state.open = false;
    };
    const onKey = (e) => {
      if (e.key === "Escape") state.open = false;
    };
    document.addEventListener("click", onDocClick);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("click", onDocClick);
      document.removeEventListener("keydown", onKey);
    };
  });

  const triggerClasses = () =>
    twMerge(
      "inline-flex h-8 w-[240px] items-center justify-start gap-1.5 rounded-lg border border-border bg-background px-2.5 text-sm font-normal whitespace-nowrap transition-all outline-none select-none hover:bg-muted focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 [&_svg]:size-4 [&_svg]:shrink-0",
      state.ts ? "" : "text-muted-foreground",
      className,
    );
</script>

<div data-slot="date-picker" class="relative inline-block">
  <button type="button" class="{triggerClasses()}" onclick="() => (state.open = !state.open)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" /></svg>
    {label()}
  </button>
  <if when="state.open">
    <div class="absolute top-full left-0 z-50 mt-1 w-auto rounded-lg bg-background shadow-md ring-1 ring-border">
      <Calendar selected="{state.ts}" onSelect="{pick}" />
    </div>
  </if>
</div>
