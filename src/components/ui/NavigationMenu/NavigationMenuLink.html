<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { href = "#", variant = "default", class: className = "", children } = props();

  const variants = {
    default:
      "flex items-center gap-2 rounded-md p-2 text-sm transition-all outline-none hover:bg-muted focus:bg-muted focus-visible:ring-3 focus-visible:ring-ring/50 [&_svg:not([class*='size-'])]:size-4",
    trigger:
      "inline-flex h-9 w-max items-center justify-center rounded-lg px-2.5 py-1.5 text-sm font-medium transition-all outline-none hover:bg-muted focus:bg-muted focus-visible:ring-3 focus-visible:ring-ring/50",
  };

  const classes = () => twMerge(variants[variant] || variants.default, className);
</script>

<a data-slot="navigation-menu-link" href="{href}" class="{classes()}">{children}</a>
