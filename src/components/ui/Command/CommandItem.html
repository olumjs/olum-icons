<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { disabled = false, onSelect, class: className = "", children } = props();

  const handleClick = () => onSelect && onSelect();

  const base =
    "group/command-item relative flex w-full cursor-default items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-none select-none hover:bg-muted hover:text-foreground data-[selected=true]:bg-accent data-[selected=true]:text-accent-foreground disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const classes = () => twMerge(base, className);
</script>

<button type="button" data-slot="command-item" disabled="{disabled}" class="{classes()}" onclick="handleClick()">{children}</button>
