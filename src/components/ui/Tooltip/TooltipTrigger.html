<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "", children } = props();

  onMount(() => {
    const root = host.closest('[data-slot="tooltip"]');
    const input = root && root.querySelector(":scope > input");
    const el = host.firstElementChild;

    const set = (val) => {
      if (!input) return;
      input.checked = val;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const onEnter = () => set(true);
    const onLeave = () => set(false);
    const onFocus = () => set(true);
    const onBlur = () => set(false);

    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);
    el.addEventListener("focus", onFocus);
    el.addEventListener("blur", onBlur);
    return () => {
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
      el.removeEventListener("focus", onFocus);
      el.removeEventListener("blur", onBlur);
    };
  });

  const classes = () => twMerge(className);
</script>

<span data-slot="tooltip-trigger" class="{classes()}">{children}</span>
