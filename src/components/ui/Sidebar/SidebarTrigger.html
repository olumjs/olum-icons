<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "" } = props();

  const toggle = () => {
    const wrapper = host.closest('[data-slot="sidebar-wrapper"]');
    if (!wrapper) return;
    wrapper.setAttribute("data-state", wrapper.getAttribute("data-state") === "collapsed" ? "expanded" : "collapsed");
  };

  const classes = () =>
    twMerge(
      "inline-flex size-7 shrink-0 items-center justify-center rounded-[min(var(--radius-md),12px)] border border-transparent text-foreground transition-all outline-none select-none hover:bg-muted focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 [&_svg]:size-4 [&_svg]:shrink-0",
      className,
    );
</script>

<button type="button" data-slot="sidebar-trigger" class="{classes()}" onclick="toggle()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /></svg>
  <span class="sr-only">Toggle Sidebar</span>
</button>
