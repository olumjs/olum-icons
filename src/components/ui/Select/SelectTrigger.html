<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";

  const { size = "default", disabled = false, class: className = "", children } = props();

  onMount(() => {
    const root = host.closest('[data-slot="select"]');
    const input = root && root.querySelector(":scope > input");
    const btn = host.querySelector("button");
    const onClick = () => {
      if (!input) return;
      input.checked = !input.checked;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };
    btn.addEventListener("click", onClick);
    return () => btn.removeEventListener("click", onClick);
  });

  const base =
    "flex w-fit items-center justify-between gap-1.5 rounded-lg border border-border bg-transparent py-2 pr-2 pl-2.5 text-sm whitespace-nowrap transition-colors outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 [&>[data-olum]]:contents [&_[data-slot=select-value]]:line-clamp-1 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const sizes = {
    default: "h-8",
    sm: "h-7 rounded-[min(var(--radius-md),10px)]",
  };

  const classes = () => twMerge(base, sizes[size] || sizes.default, className);
</script>

<button type="button" data-slot="select-trigger" data-size="{size}" disabled="{disabled}" class="{classes()}">
  {children}
  <svg class="pointer-events-none size-4 text-muted-foreground" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
</button>
