<script>
  import { props, onMount } from "olum";
  import { twMerge } from "tailwind-merge";

  const { class: className = "", children } = props();

  onMount(() => {
    const root = host.closest('[data-slot="select"]');
    const input = root && root.querySelector(":scope > input");

    const close = () => {
      if (!input) return;
      input.checked = false;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const onDocClick = (e) => {
      if (root && !root.contains(e.target)) close();
    };
    const onKey = (e) => {
      if (e.key === "Escape" && input && input.checked) close();
    };

    document.addEventListener("click", onDocClick);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("click", onDocClick);
      document.removeEventListener("keydown", onKey);
    };
  });

  const classes = () =>
    twMerge(
      "absolute top-full left-0 z-50 mt-1 max-h-72 w-full min-w-36 overflow-x-hidden overflow-y-auto rounded-lg bg-background text-foreground shadow-md ring-1 ring-border outline-none",
      className,
    );
</script>

<div data-slot="select-content" class="{classes()}">{children}</div>
