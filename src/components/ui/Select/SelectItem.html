<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";

  const { value, disabled = false, class: className = "", children } = props();

  const base =
    "relative flex w-full cursor-default items-center gap-1.5 rounded-md py-1 pr-8 pl-1.5 text-sm outline-none select-none hover:bg-muted disabled:pointer-events-none disabled:opacity-50 [&[data-checked]_[data-slot=select-item-indicator]]:flex [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4";

  const classes = () => twMerge(base, className);
</script>

<button type="button" data-slot="select-item" data-value="{value}" disabled="{disabled}" class="{classes()}">
  <span class="flex flex-1 shrink-0 gap-2 whitespace-nowrap text-left">{children}</span>
  <span data-slot="select-item-indicator" class="pointer-events-none absolute right-2 hidden size-4 items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
  </span>
</button>
