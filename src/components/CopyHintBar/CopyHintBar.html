<script>
  import { onMount } from "olum";

  const REPO = "https://github.com/olumjs/olum-icons";
  const STORAGE_KEY = "olum-icons:hint-dismissed";

  const state = { visible: false };

  const dismiss = () => {
    state.visible = false;
    localStorage.setItem(STORAGE_KEY, "1");
  };

  onMount(() => {
    state.visible = localStorage.getItem(STORAGE_KEY) !== "1";
  });

  const icons = {
    copy: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg>`,
    close: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>`,
  };
</script>

<if when="state.visible">
  <div class="pointer-events-none fixed inset-x-0 bottom-4 z-30 flex justify-center px-4 lg:pl-64">
    <div class="pointer-events-auto flex w-full max-w-xl items-start gap-3 rounded-xl border border-border bg-background p-4 shadow-lg">
      <div class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-muted text-foreground [&_svg]:size-4" html="icons.copy"></div>

      <div class="min-w-0 flex-1">
        <p class="text-sm text-foreground">Click an icon to copy the SVG code</p>
        <p class="text-sm text-muted-foreground">
          You can also use copy component name or import statement
        </p>
      </div>

      <a href="{REPO}" target="_blank" rel="noreferrer" class="shrink-0 self-center text-sm font-medium text-foreground underline-offset-4 hover:underline">
        View usage guide
      </a>

      <button
        type="button"
        onclick="dismiss()"
        aria-label="Dismiss"
        class="inline-flex size-6 shrink-0 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-muted hover:text-foreground [&_svg]:size-3.5"
      >
        <div html="icons.close"></div>
      </button>
    </div>
  </div>
</if>
