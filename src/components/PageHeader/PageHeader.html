<script>
  import { props } from "olum";
  import { BASE, describe, label, nextOf, prevOf } from "../../utils/components";
  import Anchor from "../ui/Anchor/Anchor";

  const { id } = props();

  const prev = () => prevOf(id);
  const next = () => nextOf(id);

  const icons = {
    chevronLeft: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-arrow-left "><path d="M5 12l14 0"></path><path d="M5 12l6 6"></path><path d="M5 12l6 -6"></path></svg>`,
    chevronRight: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-arrow-right "><path d="M5 12l14 0"></path><path d="M13 18l6 -6"></path><path d="M13 6l6 6"></path></svg>`,
  };
</script>

<header class="flex flex-col gap-2">
  <div class="flex items-center justify-between gap-4">
    <h1 class="text-3xl font-semibold tracking-tight capitalize">{label(id)}</h1>

    <!-- Icon-only, so each link needs an aria-label naming its destination --
         the chevron alone tells a screen reader nothing. Each Anchor renders in
         its own OlumJS host div, which would become the flex item instead of
         the anchor; `contents` collapses them so the pair sits together. -->
    <nav aria-label="Component" class="flex shrink-0 items-center gap-1 [&>[data-olum]]:contents">
      <if when="prev()">
        <Anchor to="{BASE}/{prev()}" variant="secondary" size="icon-sm" ariaLabel="Previous: {label(prev())}">
          <span html="icons.chevronLeft"></span>
        </Anchor>
      </if>

      <if when="next()">
        <Anchor to="{BASE}/{next()}" variant="secondary" size="icon-sm" ariaLabel="Next: {label(next())}">
          <span html="icons.chevronRight"></span>
        </Anchor>
      </if>
    </nav>
  </div>

  <if when="describe(id)">
    <p class="text-base text-muted-foreground">{describe(id)}</p>
  </if>
</header>
