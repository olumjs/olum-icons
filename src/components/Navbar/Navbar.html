<script>
  import { onMount, pathname } from "olum";
  import Command from "../ui/Command/Command";
  import CommandDialog from "../ui/Command/CommandDialog";
  import CommandDialogContent from "../ui/Command/CommandDialogContent";
  import CommandDialogTrigger from "../ui/Command/CommandDialogTrigger";
  import CommandEmpty from "../ui/Command/CommandEmpty";
  import CommandGroup from "../ui/Command/CommandGroup";
  import CommandInput from "../ui/Command/CommandInput";
  import CommandList from "../ui/Command/CommandList";
  import Kbd from "../ui/Kbd/Kbd";
  import KbdGroup from "../ui/Kbd/KbdGroup";
  import { BASE, components, label } from "../../utils/components";
  import Anchor from "../ui/Anchor/Anchor";
  import Button from "../ui/Button/Button";
  import Separator from "../ui/Separator/Separator";

  const state = { dark: false, stars: null };

  const REPO = "https://github.com/olumjs/olum-ui";
  const REPO_API = REPO.replace("https://github.com/", "https://api.github.com/repos/");

  // Cached in sessionStorage so navigating between component pages -- which
  // remounts this component every time (see the onMount comment below) --
  // doesn't refire the request and burn the 60/hr unauthenticated rate limit.
  // sessionStorage over localStorage: the count is low-stakes enough that
  // self-clearing per tab beats risking an hour-stale number on a shared machine.
  const STARS_CACHE_KEY = "gh-stars";
  const STARS_TTL = 60 * 60 * 1000;

  const formatStars = (n) => {
    if (n <= 0) return "";
    return n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, "")}k` : `${n}`
  };

  const loadStars = async () => {
    const cached = JSON.parse(sessionStorage.getItem(STARS_CACHE_KEY) || "null");
    if (cached && Date.now() - cached.at < STARS_TTL) {
      state.stars = cached.value;
      return;
    }
    try {
      const res = await fetch(REPO_API);
      if (!res.ok) return;
      const data = await res.json();
      if (typeof data.stargazers_count !== "number") return;
      // state.stars = formatStars(data.stargazers_count);
      state.stars = data.stargazers_count;
      sessionStorage.setItem(STARS_CACHE_KEY, JSON.stringify({ value: state.stars, at: Date.now() }));
    } catch {}
  };

  const icons = {
    // Same path as public/favicon.svg, inlined so it can take currentColor --
    // the file itself is fill="black" and would disappear in dark mode.
    logo: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M250 465.217L0 30.4346L500 30.4346L250 465.217Z" /></svg>`,
    sun: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>`,
    moon: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>`,
    search: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>`,
    github: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.2c-3.34.72-4.04-1.42-4.04-1.42-.55-1.38-1.34-1.75-1.34-1.75-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.96 0-1.31.47-2.39 1.24-3.23-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.92 1.23 3.23 0 4.63-2.8 5.65-5.48 5.95.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z" /></svg>`,
  };

  // Palette rows are plain router anchors rather than <CommandItem>: an item
  // needs to carry its target id, and dashed attributes get truncated on a
  // component tag. Wearing data-slot="command-item" still opts them into
  // Command's own filtering and CommandDialogContent's close-on-select.
  const item =
    "flex w-full cursor-pointer items-center gap-2 rounded-sm px-2 py-1.5 text-sm capitalize outline-none select-none hover:bg-muted hover:text-foreground data-[selected=true]:bg-accent data-[selected=true]:text-accent-foreground";

  // The router's own `active` class only fires on an exact path match (see
  // olum-router's `active()`), so it never lights up for "/elements" while
  // browsing "/elements/accordion". This checks the prefix instead, so the
  // link stays highlighted anywhere under the section it points at.
  const isElementsActive = () => pathname() === BASE || pathname().startsWith(`${BASE}/`);

  const applyTheme = (dark) => {
    state.dark = dark;
    document.documentElement.classList.toggle("dark", dark);
    localStorage.setItem("theme", dark ? "dark" : "light");
  };

  const toggleTheme = () => applyTheme(!state.dark);

  // One onMount per component, so theme restore and the hotkey share it.
  onMount(() => {
    const saved = localStorage.getItem("theme");
    applyTheme(saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);

    loadStars();

    // CommandDialog keeps its open state on a hidden checkbox, so opening the
    // palette by hand means flipping that the same way the trigger does.
    const onKey = (e) => {
      if (e.key !== "k" || (!e.metaKey && !e.ctrlKey)) return;
      const box = host.querySelector('[data-slot="command-dialog"] > input');
      if (!box || box.checked) return;
      e.preventDefault();
      box.checked = true;
      box.dispatchEvent(new Event("change", { bubbles: true }));
    };

    // Every route change remounts this component, and onMount's cleanup doesn't
    // run then, so a plain addEventListener accumulates one document listener per
    // visit. Each stale closure still holds its own detached host, so one Ctrl+K
    // opened every past palette at once -- seven stacked overlays reading as a
    // much darker scrim. (Clicking never showed it: only the live trigger button
    // is in the DOM to receive a click.) Park the handler on `document` so a
    // remount can retire the previous one; top-level consts here are per-instance
    // and can't hold it.
    if (document.__olumPaletteKeydown) document.removeEventListener("keydown", document.__olumPaletteKeydown);
    document.addEventListener("keydown", onKey);
    document.__olumPaletteKeydown = onKey;

    return () => {
      document.removeEventListener("keydown", onKey);
      if (document.__olumPaletteKeydown === onKey) document.__olumPaletteKeydown = null;
    };
  });
</script>

<header data-slot="navbar" class="fixed inset-x-0 top-0 z-50 h-14 border-b border-border bg-background/80 backdrop-blur">
  <div class="flex h-full items-center justify-between px-4 sm:px-6">
    <div class="flex gap-x-2">
      <Anchor variant="ghost" to="/" class="flex shrink-0 items-center gap-2 text-sm font-semibold tracking-tight">
        <div class="pointer-events-none size-4 [&_svg]:size-4" html="icons.logo"></div>
        olum/ui
      </Anchor>

      <Anchor variant="ghost" to="{BASE}" class="">Components</Anchor>
    </div>

    <!-- Separator renders inside its own OlumJS host div, so the row has to
         collapse those wrappers for the vertical rule to actually take height. -->
    <div class="flex items-center gap-x-2 justify-between [&>[data-olum]]:contents">
      <CommandDialog>
        <CommandDialogTrigger
          class="inline-flex h-8 w-44 items-center gap-2 rounded-lg border border-border bg-background pr-1.5 pl-2.5 text-sm text-muted-foreground transition-all outline-none select-none hover:bg-muted focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 sm:w-64 [&_svg]:size-4"
        >
          <div html="icons.search"></div>
          Search...
          <KbdGroup class="ml-auto">
            <Kbd>Ctrl</Kbd>
            <Kbd>K</Kbd>
          </KbdGroup>
        </CommandDialogTrigger>

        <CommandDialogContent>
          <Command>
            <CommandInput placeholder="Search components..." />
            <CommandList>
              <CommandEmpty>No components found.</CommandEmpty>
              <CommandGroup heading="Components">
                <for each="id of components" key="id">
                  <a to="{BASE}/{id}" data-slot="command-item" class="{item}">{label(id)}</a>
                </for>
              </CommandGroup>
            </CommandList>
          </Command>
        </CommandDialogContent>
      </CommandDialog>

      <Separator orientation="vertical" class="h-4 self-center" />

      <Anchor variant="ghost" href="{REPO}" target="_blank" rel="noreferrer" ariaLabel="GitHub repository">
        <span html="icons.github"></span>
        <if when="state.stars">
          <span class="flex items-center gap-1 text-xs text-muted-foreground">{formatStars(state.stars)}</span>
        </if>
      </Anchor>

      <Button variant="ghost" onclick="{toggleTheme}" ariaLabel="Toggle dark mode">
        <div html="state.dark ? icons.sun : icons.moon"></div>
      </Button>
    </div>
  </div>
</header>
