<script>
  import { props } from "olum";
  import { twMerge } from "tailwind-merge";
  import CodeBlock from "../CodeBlock/CodeBlock";

  // `label` names the case and is also what scripts/gen-snippets.mjs slugs into
  // the snippets key -- keep the two in step. `snippet` is that generated entry.
  // `previewClass` lets a demo whose popover would otherwise be clipped ask for
  // a taller preview -- the card is overflow-hidden to keep its rounded corners.
  const { label, snippet = {}, previewClass = "", children } = props();

  const preview = () =>
    twMerge("flex min-h-28 flex-wrap items-center justify-center gap-6 p-8 [&>[data-olum]]:contents", previewClass);
</script>

<!-- scroll-mt clears the fixed navbar when PageToc jumps to this anchor. -->
<section id="{snippet.key}" class="flex scroll-mt-20 flex-col gap-3">
  <if when="label">
    <h2 class="text-lg font-semibold tracking-tight capitalize">{label}</h2>
  </if>

  <div class="overflow-hidden rounded-xl border border-border">
    <!-- The demo children render live here; the code below is generated from
         this exact markup, so the two can't drift. -->
    <div class="{preview()}">{children}</div>

    <if when="snippet.html">
      <CodeBlock
        class="rounded-none border-0 border-t border-border"
        code="{snippet.code}"
        html="{snippet.html}"
        collapsible="{true}"
      />
    </if>
  </div>
</section>
