<script>
  import { onMount, props } from "olum";
  import { BASE, components, label } from "../../utils/components";
  import Anchor from "../ui/Anchor/Anchor";

  const { id } = props();

  const base = "rounded-md px-2 py-1.5 text-sm capitalize transition-colors";
  const active = "bg-muted font-medium text-foreground";
  const idle = "text-muted-foreground hover:bg-muted hover:text-foreground";

  const itemClass = cid => `${base} ${cid === id ? active : idle}`;

  // Each route remounts this list, so the scroll position resets to the top --
  // pull the current component back into view. The anchor is matched on `to`
  // because attributes written on a component tag become props, not DOM
  // attributes, so a `data-active` marker would never reach the element.
  onMount(() => {
    const list = host.querySelector("aside");
    const current = list.querySelector(`a[to="${BASE}/${id}"]`);
    if (!current) return;
    list.scrollTop = current.offsetTop - list.clientHeight / 2 + current.offsetHeight / 2;
  });
</script>

<!-- Fixed rail; body carries a matching padding-left at lg (see src/main.css).
     Named GalleryNav, not Sidebar, so it can't collide with the ui/Sidebar port
     that the sidebar example imports. -->
<aside
  data-slot="gallery-nav"
  class="fixed bottom-0 left-0 top-14 z-50 hidden w-64 overflow-y-auto border-r border-border bg-background [scrollbar-width:none] lg:block [&::-webkit-scrollbar]:hidden"
>
  <div class="flex flex-col gap-4 px-6 py-8">
    <nav class="flex flex-col gap-0.5">
      <for each="cid of components" key="cid">
        <Anchor to="{BASE}/{cid}" class="{itemClass(cid)}" variant="ghost">{label(cid)}</Anchor>
      </for>
    </nav>
  </div>
</aside>
