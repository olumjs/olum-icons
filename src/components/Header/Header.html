<script>
  import Anchor from "../ui/Anchor/Anchor";
  import Button from "../ui/Button/Button";
  import Separator from "../ui/Separator/Separator";
  import Icon from "../ui/Icon/Icon";
  import { onMount } from "olum";
  import { galleryStore } from "../../store/gallery";

  const REPO = "https://github.com/olumjs/olum-icons";

  const state = { dark: false };

  const icons = {
    // Same mark as public/favicon.svg, inlined so it can take currentColor --
    // the file itself is a flat fill and would disappear in dark mode.
    logo: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M250 465.217L0 30.4346L500 30.4346L250 465.217Z" /></svg>`,
    search: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>`,
    sun: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>`,
    moon: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>`,
    github: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.2c-3.34.72-4.04-1.42-4.04-1.42-.55-1.38-1.34-1.75-1.34-1.75-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.96 0-1.31.47-2.39 1.24-3.23-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.92 1.23 3.23 0 4.63-2.8 5.65-5.48 5.95.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z" /></svg>`,
    externalLink: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>`,
  };

  const applyTheme = (dark) => {
    state.dark = dark;
    document.documentElement.classList.toggle("dark", dark);
    localStorage.setItem("theme", dark ? "dark" : "light");
  };

  const toggleTheme = () => applyTheme(!state.dark);

  onMount(() => {
    const saved = localStorage.getItem("theme");
    applyTheme(saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);

    // Ctrl/Cmd+K focuses the search field, mirroring the shortcut hint shown
    // inside the input itself.
    const onKey = (e) => {
      if (e.key !== "k" || (!e.metaKey && !e.ctrlKey)) return;
      const input = host.querySelector('[data-slot="gallery-search"]');
      if (!input) return;
      e.preventDefault();
      input.focus();
      input.select();
    };

    // Every route/remount could otherwise stack listeners -- see Navbar.html's
    // original comment on this exact issue -- so park the handler on
    // `document` behind a marker that a later mount can replace.
    if (document.__olumSearchKeydown) document.removeEventListener("keydown", document.__olumSearchKeydown);
    document.addEventListener("keydown", onKey);
    document.__olumSearchKeydown = onKey;

    return () => {
      document.removeEventListener("keydown", onKey);
      if (document.__olumSearchKeydown === onKey) document.__olumSearchKeydown = null;
    };
  });
</script>

<header data-slot="header" class="fixed inset-x-0 top-0 z-40 h-14 border-b border-border bg-background/80 backdrop-blur">
  <div class="flex h-full items-center gap-2 px-4 sm:px-6">
    <Anchor variant="ghost" to="/" class="">
      <Icon icon="{icons.logo}" class="relative top-0.5" />
      olum/icons
    </Anchor>
    <Anchor variant="ghost" to="/usage" class="">Usage</Anchor>
    <Anchor variant="ghost" to="/about" class="">About</Anchor>
    <Anchor variant="ghost" to="/license" class="">License</Anchor>
    <Anchor variant="ghost" to="/attribution" class="">Attribution</Anchor>

    <div class="flex-1"></div>

    <div class="w-full max-w-md">
      <label
        class="flex h-9 items-center gap-2 rounded-lg border border-border bg-background pr-2 pl-3 text-sm text-muted-foreground transition-all focus-within:border-ring focus-within:ring-3 focus-within:ring-ring/50 [&_svg]:size-4"
      >
        <div html="icons.search"></div>
        <input
          data-slot="gallery-search"
          type="text"
          placeholder="Search icons..."
          value="{galleryStore.query}"
          oninput="(e) => galleryStore.setQuery(e.target.value)"
          class="h-full w-full min-w-0 flex-1 bg-transparent text-foreground outline-none placeholder:text-muted-foreground"
        />
        <kbd
          class="hidden shrink-0 items-center gap-0.5 rounded border border-border bg-muted px-1.5 py-0.5 font-mono text-[0.7rem] text-muted-foreground sm:inline-flex"
          >Ctrl K</kbd
        >
      </label>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <Button onclick="{toggleTheme}" variant="ghost">
        <div html="state.dark ? icons.sun : icons.moon"></div>
      </Button>

      <Anchor href="{REPO}" target="_blank" rel="noreferrer" variant="ghost">
        <span html="icons.github"></span>
      </Anchor>
    </div>
  </div>
</header>
