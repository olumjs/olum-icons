<script>
  import AreaChart from "../../components/ui/Chart/AreaChart";
  import BarChart from "../../components/ui/Chart/BarChart";
  import ComposedChart from "../../components/ui/Chart/ComposedChart";
  import DonutChart from "../../components/ui/Chart/DonutChart";
  import LineChart from "../../components/ui/Chart/LineChart";
  import RadialBarChart from "../../components/ui/Chart/RadialBarChart";
  import DemoBlock from "../../components/DemoBlock/DemoBlock";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";
  import InstallBlock from "../../components/InstallBlock/InstallBlock";
  import Navbar from "../../components/Navbar/Navbar";
  import PageHeader from "../../components/PageHeader/PageHeader";
  import Pager from "../../components/Pager/Pager";
  import { snippets } from "./snippets";

  // Shared by the cartesian charts so the blocks read as one dataset seen six ways.
  const chartData = [
    { month: "Jan", desktop: 186, mobile: 80 },
    { month: "Feb", desktop: 305, mobile: 200 },
    { month: "Mar", desktop: 237, mobile: 120 },
    { month: "Apr", desktop: 73, mobile: 190 },
    { month: "May", desktop: 209, mobile: 130 },
    { month: "Jun", desktop: 214, mobile: 140 },
  ];

  const chartConfig = {
    desktop: { label: "Desktop", color: "var(--color-chart-1)" },
    mobile: { label: "Mobile", color: "var(--color-chart-2)" },
  };

  // Composed needs a per-series type; donut and radial take their own shapes.
  const composedChartConfig = {
    desktop: { label: "Desktop", color: "var(--color-chart-1)", type: "bar" },
    mobile: { label: "Mobile", color: "var(--color-chart-2)", type: "line" },
  };

  const donutChartData = [
    { name: "Chrome", value: 275, color: "var(--color-chart-1)" },
    { name: "Safari", value: 200, color: "var(--color-chart-2)" },
    { name: "Firefox", value: 187, color: "var(--color-chart-3)" },
    { name: "Edge", value: 173, color: "var(--color-chart-4)" },
    { name: "Other", value: 90, color: "var(--color-chart-5)" },
  ];

  const radialChartData = [{ month: "january", desktop: 1260, mobile: 570 }];
</script>

<Navbar />
<GalleryNav id="chart" />
<PageToc snippets="{snippets}" />

<div class="mx-auto flex max-w-4xl flex-col gap-10 p-6 sm:p-10">
  <PageHeader id="chart" />

  
  <DemoBlock label="bar" snippet="{snippets['bar']}">
    <BarChart data="{chartData}" config="{chartConfig}" class="h-64 w-full max-w-md" />
  </DemoBlock>
  <InstallBlock id="chart" />

  <DemoBlock label="line" snippet="{snippets['line']}">
    <LineChart data="{chartData}" config="{chartConfig}" class="h-64 w-full max-w-md" />
  </DemoBlock>

  <DemoBlock label="area" snippet="{snippets['area']}">
    <AreaChart data="{chartData}" config="{chartConfig}" class="h-64 w-full max-w-md" />
  </DemoBlock>

  <DemoBlock label="composed" snippet="{snippets['composed']}">
    <ComposedChart data="{chartData}" config="{composedChartConfig}" class="h-64 w-full max-w-md" />
  </DemoBlock>

  <DemoBlock label="donut" snippet="{snippets['donut']}">
    <DonutChart data="{donutChartData}" label="Visitors" class="w-full max-w-md" />
  </DemoBlock>

  <DemoBlock label="radial bar" snippet="{snippets['radial-bar']}">
    <RadialBarChart data="{radialChartData}" config="{chartConfig}" centerLabel="Visitors" class="w-full max-w-md" />
  </DemoBlock>

  <Pager id="chart" />
</div>
