<script>
  import Attachment from "../../components/ui/Attachment/Attachment";
  import AttachmentGroup from "../../components/ui/Attachment/AttachmentGroup";
  import AttachmentMedia from "../../components/ui/Attachment/AttachmentMedia";
  import AttachmentContent from "../../components/ui/Attachment/AttachmentContent";
  import AttachmentTitle from "../../components/ui/Attachment/AttachmentTitle";
  import AttachmentDescription from "../../components/ui/Attachment/AttachmentDescription";
  import AttachmentActions from "../../components/ui/Attachment/AttachmentActions";
  import AttachmentAction from "../../components/ui/Attachment/AttachmentAction";
  import Spinner from "../../components/ui/Spinner/Spinner";
  import Navbar from "../../components/Navbar/Navbar";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";
  import Pager from "../../components/Pager/Pager";
  import DemoBlock from "../../components/DemoBlock/DemoBlock";
  import InstallBlock from "../../components/InstallBlock/InstallBlock";
  import PageHeader from "../../components/PageHeader/PageHeader";
  import { snippets } from "./snippets";

  const icons = {
    fileText: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg>`,
    trash: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></svg>`,
    file: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /></svg>`,
    plus: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>`,
  };
</script>

<Navbar />
<GalleryNav id="attachment" />
<PageToc snippets="{snippets}" />

<div class="mx-auto flex max-w-4xl flex-col gap-10 p-6 sm:p-10">
  <PageHeader id="attachment" />

  
  <DemoBlock label="states, horizontal" snippet="{snippets['states-horizontal']}">
    <AttachmentGroup class="flex-col">
      <Attachment>
        <AttachmentMedia>
          <div html="icons.fileText"></div>
        </AttachmentMedia>
        <AttachmentContent>
          <AttachmentTitle>report.pdf</AttachmentTitle>
          <AttachmentDescription>2.4 MB</AttachmentDescription>
        </AttachmentContent>
        <AttachmentActions>
          <AttachmentAction>
            <div html="icons.trash" class="[&_svg]:size-3!"></div>
          </AttachmentAction>
        </AttachmentActions>
      </Attachment>
      <Attachment state="uploading">
        <AttachmentMedia>
          <Spinner />
        </AttachmentMedia>
        <AttachmentContent>
          <AttachmentTitle>video.mp4</AttachmentTitle>
          <AttachmentDescription>Uploading…</AttachmentDescription>
        </AttachmentContent>
      </Attachment>
      <Attachment state="error">
        <AttachmentMedia>
          <div html="icons.file"></div>
        </AttachmentMedia>
        <AttachmentContent>
          <AttachmentTitle>archive.zip</AttachmentTitle>
          <AttachmentDescription>Upload failed</AttachmentDescription>
        </AttachmentContent>
      </Attachment>
      <Attachment state="idle">
        <AttachmentMedia>
          <div html="icons.plus"></div>
        </AttachmentMedia>
        <AttachmentContent>
          <AttachmentTitle>Add file</AttachmentTitle>
          <AttachmentDescription>Drag &amp; drop or click</AttachmentDescription>
        </AttachmentContent>
      </Attachment>
    </AttachmentGroup>
  </DemoBlock>
  <InstallBlock id="attachment" />

  <DemoBlock label="vertical, sm" snippet="{snippets['vertical-sm']}">
    <Attachment orientation="vertical" size="sm">
      <AttachmentMedia>
        <div html="icons.file"></div>
      </AttachmentMedia>
      <AttachmentContent>
        <AttachmentTitle>notes.txt</AttachmentTitle>
        <AttachmentDescription>12 KB</AttachmentDescription>
      </AttachmentContent>
    </Attachment>
  </DemoBlock>

  <Pager id="attachment" />
</div>
