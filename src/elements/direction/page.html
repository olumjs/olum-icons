<script>

  import ButtonGroup from "../../components/ui/ButtonGroup/ButtonGroup";

  import Switch from "../../components/ui/Switch/Switch";
  import Navbar from "../../components/Navbar/Navbar";
  import GalleryNav from "../../components/GalleryNav/GalleryNav";
  import PageToc from "../../components/PageToc/PageToc";

  import InstallBlock from "../../components/InstallBlock/InstallBlock";

  };
</script>

<Navbar />
<GalleryNav id="direction" />
<PageToc snippets="{snippets}" />

  <DemoBlock label="default" snippet="{snippets['default']}">
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2">
        <Switch id="dir-switch" onCheckedChange="{setDirection}" />
        <Label for="dir-switch">Right-to-left</Label>
      </div>
      <Direction direction="{state.direction}">
        <ButtonGroup>
          <Button variant="outline">
            <div data-icon="inline-start" html="icons.arrowRight"></div> First
          </Button>
          <Button variant="outline">Second</Button>
          <Button variant="outline">Third</Button>
        </ButtonGroup>

    </div>

  <InstallBlock id="direction" />
